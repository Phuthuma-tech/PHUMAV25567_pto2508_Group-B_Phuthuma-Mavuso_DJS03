<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>PodCast — Discover Your Next Favourite Show</title>
    <meta
      name="description"
      content="Browse hundreds of podcast shows across comedy, history, fiction, business, and more. Updated daily."
    />

    <!-- Open Graph -->
    <meta property="og:title"       content="PodCast — Discover Your Next Favourite Show" />
    <meta property="og:description" content="Browse hundreds of podcasts across every genre." />
    <meta property="og:type"        content="website" />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!--
      React mounts into this element.
      src/main.jsx calls ReactDOM.createRoot(document.getElementById('root'))
    -->
    <div id="root"></div>

    <!-- Vite bundles and injects this script automatically during build -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
